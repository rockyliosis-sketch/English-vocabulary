name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'functions/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test & Deploy Pages (Production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run core tests
        run: node --test tests/scheduler.test.mjs tests/api.test.mjs tests/e2e.test.mjs tests/tts.test.mjs tests/import-inbox.test.mjs

      - name: Check Cloudflare Secrets
        id: check_secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID 尚未配置。请在仓库 Settings -> Secrets and variables -> Actions 中添加这两个 Secret，然后点击 Run workflow 手动触发部署。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.check_secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'english-vocabulary' }} --branch=main
